[project]
name = "bmlm"
version = "0.1.0"
description = "Big Model Little Model: Hierarchical agents for Android GUI automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PyTorch with CUDA support (install separately via pip with correct CUDA version)
    # pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # HuggingFace for model loading
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0",  # For 4-bit/8-bit quantization on NVIDIA

    # Flash attention for faster inference (optional, install separately)
    # pip install flash-attn --no-build-isolation

    # AndroidWorld benchmark
    "android-world @ git+https://github.com/google-research/android_world.git",

    # Core utilities
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",

    # Logging and metrics
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
tracing = [
    "arize-phoenix>=5.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/bmlm"]

[tool.hatch.build.targets.wheel]
packages = ["src/bmlm"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
